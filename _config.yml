# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: amazing!!!
subtitle: 哀吾生之须臾，羡长江之无穷
description: 一个在浅色床单上哭泣的失败者的博客
author: vldh
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://alwaysloseall.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
# 不用文件修改时间充当文章 updated，避免克隆后全部显示成今天
updated_option: empty
syntax_highlighter: highlight.js
highlight:
  auto_detect: false
  line_number: true
  tab_replace: ''
  wrap: true

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/deployment.html
## 推送到 hexo 后由 .github/workflows/deploy.yml 发布：
## peaceiris/actions-gh-pages 把 public/ 强制推到 master，
## 另外 rsync 到 nekodayo:/var/www/blog。
## 下面这段只给本机 `npx hexo deploy` 用，只会更新 master。
deploy:
  type: git
  # HTTPS：云端环境没有 SSH key。本机若已配置 SSH，可改回
  # git@github.com:alwaysloseall/alwaysloseall.github.io.git
  # 并保留 branch: master。
  repo: https://github.com/alwaysloseall/alwaysloseall.github.io.git
  branch: master
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# 评论。NexT 8 读的是 _config.next.yml 里的 disqus.shortname
disqus_shortname: alwaysloseall