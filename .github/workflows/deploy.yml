# 推送到 hexo（或手动 Run workflow）后：
#   build            按 .nvmrc 安装 Node，生成 public/
#   deploy-pages     把 public/ 强制推到本仓库 master（GitHub Pages）
#   deploy-nekodayo  把 public/ rsync 到服务器 /var/www/blog
# 两个发布任务互不依赖。没配 NEKODAYO_SSH_KEY 时只有服务器任务失败。

name: Deploy

on:
  push:
    branches:
      - hexo
  workflow_dispatch:

concurrency:
  group: dual-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npx hexo clean && npx hexo generate

      - name: Check generated site
        run: |
          set -euo pipefail
          test -s public/index.html
          post=$(find public -mindepth 3 -path 'public/20*/*/*/index.html' -print -quit)
          if [ -z "${post}" ]; then
            echo "::error title=生成结果不像站点::public/ 里没有 :year/:month/:day/:title/ 文章页，已中止，避免空站覆盖 master 和服务器。"
            exit 1
          fi
          echo "生成检查通过，示例文章页：${post}"

      - name: Upload public/
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: deploy-pages
    needs: build
    if: github.ref == 'refs/heads/hexo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download public/
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Check site artifact
        run: test -s public/index.html

      - name: Deploy to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Site updated: ${{ github.sha }}"

  deploy-nekodayo:
    name: deploy-nekodayo
    needs: build
    if: github.ref == 'refs/heads/hexo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download public/
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Install rsync
        run: |
          if ! command -v rsync >/dev/null 2>&1 || ! command -v ssh-keyscan >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync openssh-client
          fi

      - name: Rsync to nekodayo
        env:
          NEKODAYO_SSH_KEY: ${{ secrets.NEKODAYO_SSH_KEY }}
          NEKODAYO_HOST: ${{ secrets.NEKODAYO_HOST }}
          NEKODAYO_USER: ${{ secrets.NEKODAYO_USER }}
          NEKODAYO_KNOWN_HOSTS: ${{ secrets.NEKODAYO_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy-nekodayo.sh
